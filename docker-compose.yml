services:
  web:
    image: php:8.2-apache
    container_name: translation-agency-template
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      SMTP_HOST: ${SMTP_HOST:-mail.example.com}
      SMTP_USER: ${SMTP_USER:-sender@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-secret}
      BUSINESS_NAME: "ANSF Translations"
      SITE_URL: "http://localhost:8084"
    volumes:
      - .:/var/www/html
